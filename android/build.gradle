
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
subprojects { subproject ->
    subproject.buildDir = "${rootProject.buildDir}/${subproject.name}"
    
    // فحص حالة التقييم لتفادي الخطأ
    if (subproject.state.executed) {
        configureAndroidProject(subproject)
    } else {
        subproject.afterEvaluate { proj ->
            configureAndroidProject(proj)
        }
    }
}

def configureAndroidProject(Project proj) {
    if (proj.hasProperty("android")) {
        proj.android {
            compileSdkVersion 34
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

    
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileSdkVersion 34
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
