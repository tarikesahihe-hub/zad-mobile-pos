name: Scaffold Windows Platform (one-time)

on:
  workflow_dispatch:

jobs:
  scaffold:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/windows-support

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Create Windows platform files
        run: flutter create --platforms=windows --project-name zad_mobile_pos .

      - name: Set Windows app display name to "ZAD POS"
        shell: pwsh
        run: |
          $mainCpp = "windows/runner/main.cpp"
          (Get-Content $mainCpp) -replace '"zad_mobile_pos"', '"ZAD POS"' | Set-Content $mainCpp

          $runnerRc = "windows/runner/Runner.rc"
          if (Test-Path $runnerRc) {
            (Get-Content $runnerRc) -replace 'zad_mobile_pos', 'ZAD POS' | Set-Content $runnerRc
          }

      - name: Commit generated Windows files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add windows/
          git diff --cached --quiet && echo "لا يوجد شيء جديد لإضافته" || git commit -m "chore: scaffold Flutter Windows platform files (auto-generated)"
          git push origin HEAD:feature/windows-support
