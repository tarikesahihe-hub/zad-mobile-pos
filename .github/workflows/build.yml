name: Build Android APK and Windows EXE

on:
  push:
    branches: [ main, feature/windows-support ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Download Gradle Wrapper files
        run: |
          curl -sSL -o android/gradlew https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradlew
          curl -sSL -o android/gradlew.bat https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradlew.bat
          mkdir -p android/gradle/wrapper
          curl -sSL -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      # ------------------------------------------------------------------
      # نستعيد ملف الـ keystore الحقيقي من GitHub Secret (base64)، ونولد
      # keystore.properties باش Gradle يقدر يوقع الـ APK بمفتاح release
      # خاص، بدل مفتاح debug العام. الملفات هاذي ما تتكوميتاش للريبو أبداً
      # (موجودة غير مؤقتاً على الـ runner، وتنمحى بعد ما البناء يخلص).
      # ------------------------------------------------------------------
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/zad-release-key.jks

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties << EOF
          storeFile=zad-release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ------------------------------------------------------------------
  # تجريبي: بناء Windows بلا أي تعديل فـ الكود بعد — الهدف نشوف الأخطاء
  # الحقيقية اللي غادي تطلع (حزم غير متوافقة) قبل ما نصلحهم واحد واحد.
  # continue-on-error يخلي فشل هاذ الـ job ما يوقفش/يفشلش الـ workflow كامل.
  # ------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows EXE
        run: flutter build windows --release

      - name: Upload Windows Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zad-pos-windows
          path: build/windows/x64/runner/Release/**
